<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trace Dashboard | SourceryKit</title>
    <link rel="icon" href="/static/logo.svg" type="image/svg+xml">

            <div class="column">
                <a class="topbar-logo" href="https://provably.ai" target="_blank" rel="noreferrer">
                    <img src="/static/logo-lockup.svg" alt="SourceryKit" width="141" height="24">
                </a>
                <nav class="topbar-actions">
                    <a class="btn btn-outline" href="https://provably.ai/docs" target="_blank" rel="noreferrer">
                        <!-- Icon / FileText, Figma 158:22933 -->
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

                            <path d="M14 2v4a2 2 0 0 0 2 2h4" />

                            <path d="M16 13H8" />

                    </a>
                    <a class="btn btn-primary" href="https://github.com/ProvablyAI/sourcerykit" target="_blank"
                        rel="noreferrer">

                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path

        <div class="margin left"></div>
        <div class="column">
            <div id="view"></div>
        </div>

        <div class="band">
            <div class="margin left"></div>
            <div class="column">
                <span>&copy; 2026 Provably. All rights reserved.</span>
                <nav>
                    <a href="https://provably.ai/terms" target="_blank" rel="noreferrer">Terms of Service</a>

                        Policy</a>
                </nav>
            </div>
            <div class="margin right"></div>
        </div>
    </footer>

    <script type="module">
        import { TraceView } from '/static/trace.js';

        // The CLI opens this page as /?id=<trace id or prefix>.
        const id = new URLSearchParams(window.location.search).get('id');
        new TraceView(document.getElementById('view')).load(id);
    </script>
</body>

</html>
